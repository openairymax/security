# agent.conf — AirymaxOS Agent 出厂 Landlock 策略
#
# 用途：为 agent 进程提供最小文件系统沙箱。系统目录只读开放，工作目录
#       可写；除此之外不得创建、删除、改名或执行任何文件。策略由
#       airy-landlock apply 施加，施加后不可逆，由 exec 继承给目标程序。
#
# 说明：未写 handled，采用缺省集合（写、删、建、改名、refer 与 execute），
#       因此读操作保持放行，ro 行实际开放的是这些根下的执行位。需要收紧
#       读权限时显式增加 handled read_file,read_dir。
#
#       工作目录必须已存在，否则 add_rule 打开路径失败，apply 退出 5。

ro /usr
ro /lib
ro /lib64
ro /etc
rw /var/lib/airy/agents
